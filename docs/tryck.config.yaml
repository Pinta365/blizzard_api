site:
  title: "blizzard_api"
  description: "TypeScript client for the Blizzard Battle.net APIs: World of Warcraft (Retail, Classic, Forever), Hearthstone, StarCraft II and Diablo III."
  baseUrl: "https://blizzard.pinta.land/"
  language: "en"

build:
  contentDir: "./content"
  outputDir: "./dist"
  staticDir: "./static"
  lastUpdated: true

defaults:
  layout: "doc"
  toc: true
  tocDepth: [2, 3]

theme:
  colorScheme: auto
  nav:
    - title: JSR
      url: https://jsr.io/@pinta365/blizzard-api
    - title: npm
      url: https://www.npmjs.com/package/@pinta365/blizzard_api
    - title: GitHub
      url: https://github.com/Pinta365/blizzard_api
  editUrl: "https://github.com/Pinta365/blizzard_api/edit/main/docs/content/"
  footer: "MIT licensed · Not affiliated with Blizzard Entertainment · Built with [tryck](https://github.com/Pinta365/tryck) · [llms.txt](/llms.txt) for AI tools"

plugins:
  llmsTxt:
    full: true
    details: "These docs describe the latest release of `@pinta365/blizzard-api` (JSR) / `@pinta365/blizzard_api` (npm). Create a client with `createClient({ region, clientId, clientSecret })`; every game is a property of it (`client.wow`, `client.wowForever`, ...). The WoW: Forever API is undocumented by Blizzard; the Forever notes describe what has been found by testing."
  social:
    image: /img/card.jpg
    imageAlt: "The text { blizzard_api } with the line TypeScript client for the Blizzard Battle.net APIs, on a dark background."
  syntaxHighlighting:
    theme: "github"
    darkTheme: "github-dark"
    lineNumbers: false
